<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <title>Wispy Trees</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico?">
    <style>
        html {
            border: 0.5rem solid black;
        }

        my-name {
            display: block;
            color: limegreen;
        }
    </style>
    <script>
        (function () {
            try {
                let saved = localStorage.getItem('theme');
                if (saved === 'light' || saved === 'dark') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (e) {

            }
        })();
    </script>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="js/themechanger.js" defer></script>
    <script src="js/weathercomponent.js" defer></script>
    <script>
        class HelloWorld extends HTMLElement {
            connectedCallback() {
                console.log("Hello World");
            }
        }

        customElements.define('hello-world', HelloWorld);
    </script>
</head>

<body>
    <hello-world></hello-world>
    <header>
        <h1>Wispy Trees</h1>
        <h2>Dmitri Singer's Portfolio/Resume Website</h2>
        <h3>
            <a href="https://github.com/diitrii">GitHub</a>
            <a href="mailto:dsinger03@outlook.com">Work Email</a>
            <a href="https://www.linkedin.com/in/dmitrisinger/">LinkedIn</a>
        </h3>
    </header>
    <main>
        <fieldset id="theme-picker" hidden>
            <legend>Theme Picker</legend>
            <label>
                <input type="radio" name="theme" value="light">
                Light
            </label>
            <label>
                <input type="radio" name="theme" value="dark">
                Dark
            </label>
            <label>
                <input type="radio" name="theme" value="auto">
                Auto
            </label>
        </fieldset>
        <section id="about">
            <h2><a href="about/">About Me</a></h2>
        </section>
        <section id="experience">
            <h2><a href="experience/">Experience</a></h2>
        </section>
        <section id="projects">
            <h2><a href="projects/">Projects</a></h2>
        </section>
        <section id="education">
            <h2><a href="education/">Education</a></h2>
        </section>
        <section id="skills">
            <h2><a href="skills/">Skills</a></h2>
        </section>
        <p>Weather data by <a href="https://open-meteo.com/">Open-Meteo.com</a></p>
        <template id="weather-template">
            <ul class="weather-card">
                <li>Temperature: <span class="weather-temp"></span>C</li>
                <li>Wind speed: <span class="weather-wind"></span>km/h</li>
            </ul>
        </template>
        <weather-widget latitude="32.7157" longitude="-117.1611">
            <p>Weather data requires JavaScript to load. Check <a href="https://weather.gov">weather.gov</a> instead.
            </p>
        </weather-widget>
    </main>
    <footer>
        <my-name>WispyTrees</my-name>
        <noscript>JavaScript is not enabled.</noscript>
    </footer>
</body>

</html>
