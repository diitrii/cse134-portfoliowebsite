<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>About Me</title>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'light' || saved === 'dark') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (e) { }
        })();
    </script>
    <script src="../js/themechanger.js" defer></script>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <fieldset id="theme-picker" hidden>
        <legend>Theme Picker</legend>
        <label>
            <input type="radio" name="theme" value="light">
            Light
        </label>
        <label>
            <input type="radio" name="theme" value="dark">
            Dark
        </label>
        <label>
            <input type="radio" name="theme" value="auto">
            Auto
        </label>
    </fieldset>
    <header>
        <h1>About Me</h1>
    </header>
    <section id="Biography">
        <h2><a href="biography/index.html">Biography</a></h2>
    </section>
    <section id="Blog">
        <h2><a href="blog/index.html">Blog</a></h2>
    </section>
    <dialog closedby="any">
        <p>This is the about section! Check my bio or my blog!</p>
    </dialog>
</body>

</html>
